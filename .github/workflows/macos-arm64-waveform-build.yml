name: macOS ARM64 waveform build

on:
  push:
    branches:
      - feat/waveform-ui
      - master
  workflow_dispatch:

jobs:
  macos-arm64:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[macarm]')
    runs-on: [self-hosted, macOS, ARM64, waveform]
    timeout-minutes: 120
    env:
      # Homebrew Qt 6 in the release bundle requires macOS 14.0.
      # Keep our own binaries at the same deployment target instead of
      # inheriting the newest installed SDK version.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Prepare case-sensitive source worktree
        shell: bash
        run: |
          set -euo pipefail

          # Manual release validation can leave a read-only copy of a previous
          # DMG mounted. CPack may then resolve bundle resources through that
          # stale volume and fail with "Operation not permitted". Ensure every
          # prior Avidemux waveform test mount is gone before packaging.
          find /Volumes -maxdepth 1 -type d -name 'Avidemux-Waveform-macOS-Apple-Silicon*' -print0 2>/dev/null |
            while IFS= read -r -d '' stale; do
              hdiutil detach "$stale" -force >/dev/null 2>&1 || true
            done

          IMAGE="$HOME/AvidemuxWaveformCI.sparseimage"
          VOLUME="/Volumes/AvidemuxWaveformCI"
          if ! mount | grep -q " on $VOLUME "; then
            if [ ! -f "$IMAGE" ]; then
              hdiutil create -size 20g -type SPARSE \
                -fs 'Case-sensitive APFS' -volname AvidemuxWaveformCI \
                "$HOME/AvidemuxWaveformCI"
            fi
            hdiutil attach "$IMAGE" -nobrowse
          fi
          rm -rf "$VOLUME/src"
          mkdir -p "$VOLUME/src"
          # actions/checkout has already materialized recursive submodules. Copy
          # that complete tree onto the case-sensitive APFS volume instead of
          # cloning submodules a second time over the network.
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" "$VOLUME/src/"
          test -f "$VOLUME/src/avidemux/qt4/i18n/CMakeLists.txt"

      - name: Build self-contained Avidemux ARM64 app and DMG
        shell: bash
        run: |
          set -euo pipefail
          VOLUME="/Volumes/AvidemuxWaveformCI"
          cd "$VOLUME/src"
          export PATH="/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
          bash bootStrapMacOS_Monterey.arm64.sh \
            --with-internal-libmp4v2 \
            --output=Avidemux-Waveform-macOS-Apple-Silicon

          APP=$(find installer -maxdepth 1 -type d -name 'Avidemux-*.app' -print -quit)
          DMG=$(find installer -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$APP" && test -d "$APP"
          test -n "$DMG" && test -f "$DMG"
          test -x "$APP/Contents/MacOS/Avidemux2.8"

          # The packaged bundle must be valid to LaunchServices, not merely runnable
          # by invoking its Mach-O executable directly.
          codesign --verify --deep --strict "$APP"
          codesign --verify "$APP/Contents/MacOS/avidemux_cli"
          codesign --verify "$APP/Contents/MacOS/avidemux_jobs"
          codesign --verify "$APP/Contents/Frameworks/QtCore.framework/Versions/A/QtCore"

          hdiutil verify "$DMG"
          file "$APP/Contents/MacOS/Avidemux2.8" | tee "$GITHUB_WORKSPACE/macos-arm64-file.txt"
          lipo -archs "$APP/Contents/MacOS/Avidemux2.8" | tee "$GITHUB_WORKSPACE/macos-arm64-archs.txt"
          grep -qw arm64 "$GITHUB_WORKSPACE/macos-arm64-archs.txt"
          MIN_OS=$(vtool -show-build "$APP/Contents/MacOS/Avidemux2.8" | awk '/minos/{print $2; exit}')
          echo "macOS deployment target: $MIN_OS"
          test "$MIN_OS" = "$MACOSX_DEPLOYMENT_TARGET"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Generate multi-track fixture
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=12" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=12" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=12" \
            -map 0:v:0 -map 1:a:0 -map 2:a:0 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            "$GITHUB_WORKSPACE/macos-waveform-multitrack-test.mkv"

      - name: Smoke launch packaged DMG app through LaunchServices
        shell: bash
        run: |
          set -euo pipefail
          VOLUME="/Volumes/AvidemuxWaveformCI"
          cd "$VOLUME/src"
          DMG_PATH="$VOLUME/src/$DMG"
          LOG="$GITHUB_WORKSPACE/macos-waveform-smoke.log"
          MOUNT=""
          cleanup() {
            pkill -x Avidemux2.8 2>/dev/null || true
            if [ -n "$MOUNT" ]; then
              hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ATTACH=$(hdiutil attach -nobrowse -readonly "$DMG_PATH")
          MOUNT=$(printf '%s\n' "$ATTACH" | awk '/\/Volumes\//{sub(/^.*\/Volumes\//,"/Volumes/"); print; exit}')
          test -n "$MOUNT" && test -d "$MOUNT"
          MOUNT_APP=$(find "$MOUNT" -maxdepth 2 -type d -name 'Avidemux-*.app' -print -quit)
          test -n "$MOUNT_APP" && test -d "$MOUNT_APP"

          # This is the same path Finder uses. It catches incompatible deployment
          # targets and malformed framework bundles which direct executable launch
          # can miss.
          pkill -x Avidemux2.8 2>/dev/null || true
          open -na "$MOUNT_APP" --args "$GITHUB_WORKSPACE/macos-waveform-multitrack-test.mkv" >"$LOG" 2>&1
          sleep 10
          PID=$(pgrep -x Avidemux2.8 | head -1 || true)
          if [ -z "$PID" ] || ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          ps -p "$PID" -o pid=,stat=,command= | tee -a "$LOG"
          cat "$LOG" || true

      - name: Stage macOS release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VOLUME="/Volumes/AvidemuxWaveformCI"
          cd "$VOLUME/src"
          DMG_PATH="$VOLUME/src/$DMG"
          APP_PATH="$VOLUME/src/$APP"
          cp "$DMG_PATH" "$GITHUB_WORKSPACE/Avidemux-Waveform-macOS-Apple-Silicon.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$GITHUB_WORKSPACE/Avidemux-Waveform-macOS-Apple-Silicon.app.zip"
          shasum -a 256 \
            "$GITHUB_WORKSPACE/Avidemux-Waveform-macOS-Apple-Silicon.dmg" \
            "$GITHUB_WORKSPACE/Avidemux-Waveform-macOS-Apple-Silicon.app.zip" \
            | tee "$GITHUB_WORKSPACE/macos-arm64-sha256.txt"

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-waveform-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            Avidemux-Waveform-macOS-Apple-Silicon.dmg
            Avidemux-Waveform-macOS-Apple-Silicon.app.zip
            macos-arm64-sha256.txt
            macos-waveform-smoke.log
            macos-waveform-multitrack-test.mkv

      - name: Cleanup worktree
        if: always()
        shell: bash
        run: |
          VOLUME="/Volumes/AvidemuxWaveformCI"
          rm -rf "$VOLUME/src" 2>/dev/null || true
