name: Windows waveform build

on:
  push:
    branches:
      - feat/waveform-ui
  workflow_dispatch:

concurrency:
  group: windows-waveform-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mingw-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Install MinGW x64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
      - name: Cross-compile portable waveform core
        run: |
          set -euxo pipefail
          CXX=x86_64-w64-mingw32-g++
          INC=-Iavidemux/common/ADM_editor/include

          $CXX -std=c++17 $INC \
            avidemux/common/ADM_editor/src/audio/ADM_waveformPeak.cpp \
            avidemux/common/ADM_editor/tests/waveformPeakTest.cpp \
            -o /tmp/waveform-peak-test.exe

          $CXX -std=c++17 $INC \
            avidemux/common/ADM_editor/src/audio/ADM_waveformCache.cpp \
            avidemux/common/ADM_editor/tests/waveformCacheTest.cpp \
            -o /tmp/waveform-cache-test.exe

          file /tmp/waveform-peak-test.exe /tmp/waveform-cache-test.exe

      - name: Source invariants
        run: |
          git diff --check HEAD^ HEAD || git diff --check
          grep -q 'DisplayChannels' avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_mwWaveform.h
          grep -q 'ADM_qtWaveformController.cpp' avidemux/qt4/ADM_userInterfaces/ADM_gui/CMakeLists.txt
          grep -q 'ADM_waveformIndexer.cpp' avidemux/common/ADM_editor/src/CMakeLists.txt
          test -f avidemux/qt4/i18n/CMakeLists.txt
  native-msys2-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Native Windows waveform checks
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          CXX=c++
          INC=-Iavidemux/common/ADM_editor/include

          $CXX -std=c++17 $INC \
            avidemux/common/ADM_editor/src/audio/ADM_waveformPeak.cpp \
            avidemux/common/ADM_editor/tests/waveformPeakTest.cpp \
            -o /tmp/waveform-peak-test.exe
          /tmp/waveform-peak-test.exe

          $CXX -std=c++17 $INC \
            avidemux/common/ADM_editor/src/audio/ADM_waveformCache.cpp \
            avidemux/common/ADM_editor/tests/waveformCacheTest.cpp \
            -o /tmp/waveform-cache-test.exe
          /tmp/waveform-cache-test.exe

          DIR=avidemux/qt4/ADM_userInterfaces/ADM_gui
          $CXX -std=c++17 $(pkg-config --cflags Qt6Widgets) -fsyntax-only "$DIR/ADM_mwWaveform.cpp"

          STUB_DIR=$(mktemp -d)
          trap 'rm -rf "$STUB_DIR"' EXIT
          printf '%s\n' \
            '#ifndef ADM_CORE_H' \
            '#define ADM_CORE_H' \
            '#define ADM_INSTALL_DIR "C:/"' \
            '#define ADM_RELATIVE_LIB_DIR "lib"' \
            '#define ADM_PLUGIN_DIR "ADM_plugins6"' \
            '#define ADM_CPU_64BIT' \
            '#define ADM_CPU_X86_64' \
            '#define HAVE_INTTYPES_H 1' \
            '#define HAVE_STDINT_H 1' \
            '#define attribute_align_arg' \
            '#endif' > "$STUB_DIR/ADM_coreConfig.h"

          ALL_INC=$(find avidemux/common avidemux_core -type d -name include -print | sed 's#^#-I#' | tr '\n' ' ')
          FFMPEG=$(pkg-config --cflags libavutil libavcodec libavformat)
          QT=$(pkg-config --cflags Qt6Widgets)

          eval $CXX -std=c++17 -fsyntax-only -I"$STUB_DIR" \
            -Iavidemux_core/ADM_coreDemuxer/include/unix $FFMPEG $ALL_INC \
            -Iavidemux/common -Iavidemux/common/ADM_editor/src \
            avidemux/common/ADM_editor/src/audio/ADM_waveformSnapshot.cpp

          eval $CXX -std=c++17 -fsyntax-only -I"$STUB_DIR" \
            -Iavidemux_core/ADM_coreDemuxer/include/unix $FFMPEG $ALL_INC \
            -Iavidemux/common -Iavidemux/common/ADM_editor/src \
            avidemux/common/ADM_editor/src/audio/ADM_waveformIndexer.cpp

          eval $CXX -std=c++17 -fsyntax-only -I"$STUB_DIR" \
            -Iavidemux_core/ADM_coreDemuxer/include/unix $FFMPEG $QT $ALL_INC \
            -Iavidemux/common -Iavidemux/common/ADM_editor/src \
            -Iavidemux/qt4/ADM_userInterfaces/ADM_gui \
            avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_qtWaveformController.cpp

  windows-package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[winbuild]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Free runner disk for MXE
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached Avidemux MXE toolchain
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer_mxe64
          file: .devcontainer_mxe64/Dockerfile
          tags: avidemux-waveform-mxe:latest
          load: true
          cache-from: type=gha,scope=avidemux-waveform-mxe
          cache-to: type=gha,mode=max,scope=avidemux-waveform-mxe

      - name: Build Windows x64 Qt6 package
        run: |
          set -euxo pipefail
          RUNNER_UID=$(id -u)
          RUNNER_GID=$(id -g)
          sudo chown -R 1000:1000 "$PWD"
          trap 'sudo chown -R "$RUNNER_UID:$RUNNER_GID" "$PWD"' EXIT
          docker run --rm \
            --user 1000:1000 \
            --volume "$PWD:/workspaces/avidemux" \
            --workdir /workspaces/avidemux \
            avidemux-waveform-mxe:latest \
            bash -lc 'bash bootStrapCrossMingwQt6_2026.sh --without-cli'
          sudo chown -R "$RUNNER_UID:$RUNNER_GID" "$PWD"
          trap - EXIT

          test -f avidemux64/avidemux.exe
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('avidemux64')
          out = pathlib.Path('avidemux-waveform-win64-qt6.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          print(out, out.stat().st_size)
          PY

      - name: Generate multi-track test fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ./tools/generate-waveform-fixture.sh windows-waveform-multitrack-test.mkv

      - name: Upload Windows build and fixture
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-waveform-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            avidemux-waveform-win64-qt6.zip
            windows-waveform-multitrack-test.mkv
