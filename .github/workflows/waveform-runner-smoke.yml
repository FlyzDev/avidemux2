name: Waveform self-hosted smoke

on:
  push:
    branches:
      - feat/waveform-ui
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64, waveform]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Runner toolchain
        run: |
          uname -a
          clang++ --version
          cmake --version
      - name: Source checks
        run: |
          git diff --check HEAD^ HEAD || git diff --check
          test -f avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_mwWaveform.cpp
          test -f avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_mwWaveform.h
          grep -q 'ADM_mwWaveform.cpp' avidemux/qt4/ADM_userInterfaces/ADM_gui/CMakeLists.txt
          grep -q 'seekRequested(double' avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_mwWaveform.h
          grep -q 'DisplayChannels' avidemux/qt4/ADM_userInterfaces/ADM_gui/ADM_mwWaveform.h
      - name: Qt6 waveform syntax
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          DIR=avidemux/qt4/ADM_userInterfaces/ADM_gui
          clang++ -std=c++17 -fPIC $(pkg-config --cflags Qt6Widgets) -fsyntax-only "$DIR/ADM_mwWaveform.cpp"
          MOC="$(brew --prefix qtbase)/share/qt/libexec/moc"
          TMP="$DIR/moc_ADM_mwWaveform.ci.cpp"
          trap 'rm -f "$TMP"' EXIT
          "$MOC" "$DIR/ADM_mwWaveform.h" -o "$TMP"
          clang++ -std=c++17 -fPIC $(pkg-config --cflags Qt6Widgets) -I"$DIR" -fsyntax-only "$TMP"

      - name: Waveform peak accumulator
        run: |
          clang++ -std=c++17 \
            -Iavidemux/common/ADM_editor/include \
            avidemux/common/ADM_editor/src/audio/ADM_waveformPeak.cpp \
            avidemux/common/ADM_editor/tests/waveformPeakTest.cpp \
            -o /tmp/waveform-peak-test
          /tmp/waveform-peak-test
